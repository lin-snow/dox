#:schema https://raw.githubusercontent.com/Goldziher/uncomment/main/schema/uncomment.schema.json
[global]
# Strip every comment except the patterns below and doc comments attached to
# declarations. TODO/FIXME markers are removed too: the only "todo" tokens in
# this repo are domain identifiers (todos, TodoService, TODO_UPDATED), which
# would otherwise fragment comment blocks line by line.
remove_todos = true
remove_fixme = true
remove_docs = false

# Do not rely on uncomment's built-in substring patterns: this repo's domain
# vocabulary ("todos", "preview") matches TODO/REVIEW and leaves orphaned
# comment lines. Keep only real directives that tools parse.
use_default_ignores = false
preserve_patterns = [
  "eslint-disable",
  "eslint-env",
  "prettier-ignore",
  "@ts-",
  "go:build",
  "go:embed",
  "go:generate",
  "+goose",
  "name:",
  "nolint",
  "noqa",
  "shellcheck",
  "yaml-language-server",
]

exclude = [
  # Generated by buf/sqlc; regenerate with `just gen` instead of editing.
  "apps/server/gen/**",
  "packages/proto-gen/src/dox/**",
  "packages/proto-gen/src/google/**",
  "apps/server/internal/db/queries/*.sql.go",
  # Proto comments are the API contract: gnostic turns them into OpenAPI
  # descriptions, so stripping them would change generated docs.
  "proto/**",
  # Keep this policy file's own documentation intact.
  ".uncomment.toml",
]
