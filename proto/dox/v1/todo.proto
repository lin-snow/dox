syntax = "proto3";

package dox.v1;

import "google/api/annotations.proto";

option go_package = "github.com/lin-snow/dox/apps/server/gen/dox/v1;doxv1";

// Todo is a single todo item, owned by a user and optionally scoped to a project.
message Todo {
  // Server-generated ULID, primary key.
  string id = 1;
  // Human-readable title.
  string title = 2;
  // Whether the todo is marked done.
  bool done = 3;
  // Creation time, UTC unix milliseconds.
  int64 created_at = 4;
  // Last update time, UTC unix milliseconds.
  int64 updated_at = 5;
  // Project the todo belongs to. Unset = Inbox (private to created_by).
  optional string project_id = 6;
  // User who created the todo.
  string created_by = 7;
  // Optional long-form body, rendered as markdown by clients. Populated only
  // by GetTodo / CreateTodo / UpdateTodo — ListTodos omits it to keep list
  // payloads small.
  optional string description = 8;
  // Optional deadline, UTC unix milliseconds. Drives sorting, Today, and the
  // overdue badge. Unset = no deadline.
  optional int64 due_at = 9;
  // True when due_at is a calendar date rather than an exact instant. Only
  // meaningful while due_at is set.
  optional bool due_all_day = 10;
  // IANA zone the all-day deadline belongs to (e.g. "Asia/Shanghai"), so
  // clients in other zones render the same calendar day. Display-only: the
  // reminder instant is carried by remind_at.
  optional string due_zone = 11;
  // Optional reminder instant, UTC unix milliseconds. Unset = remind at due_at.
  // May be set without due_at ("ping me Tuesday 15:00", no deadline). For an
  // all-day todo this must be set explicitly, otherwise no reminder fires.
  optional int64 remind_at = 12;
}

// TodoService manages todos for the authenticated user.
service TodoService {
  // ListTodos returns todos visible to the caller. With no project_id filter
  // it returns the caller's Inbox plus every project they own or are a member
  // of. project_id == "inbox" filters to Inbox only.
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse) {
    option (google.api.http) = {get: "/v1/todos"};
  }

  rpc GetTodo(GetTodoRequest) returns (Todo) {
    option (google.api.http) = {get: "/v1/todos/{id}"};
  }

  rpc CreateTodo(CreateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      post: "/v1/todos"
      body: "*"
    };
  }

  rpc UpdateTodo(UpdateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      patch: "/v1/todos/{id}"
      body: "*"
    };
  }

  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse) {
    option (google.api.http) = {delete: "/v1/todos/{id}"};
  }
}

message ListTodosRequest {
  // Filter the listing. Unset = everything visible to caller. "inbox" = Inbox
  // only. A project id = that project only (caller must be owner or member).
  optional string project_id = 1;
}

message ListTodosResponse {
  repeated Todo todos = 1;
}

message GetTodoRequest {
  string id = 1;
}

message CreateTodoRequest {
  string title = 1;
  // Unset = create in Inbox (private to caller).
  optional string project_id = 2;
  // Optional markdown description. Empty string is treated as unset.
  optional string description = 3;
  // Deadline, UTC unix milliseconds. 0 = no deadline.
  optional int64 due_at = 4;
  // Reminder instant, UTC unix milliseconds. 0 = remind at due_at.
  optional int64 remind_at = 5;
  // Marks due_at as a calendar date. Requires due_at.
  optional bool due_all_day = 6;
  // IANA zone for an all-day due_at. Requires due_at.
  optional string due_zone = 7;
}

message UpdateTodoRequest {
  string id = 1;
  optional string title = 2;
  optional bool done = 3;
  // Patch the markdown description. Empty string clears it.
  optional string description = 4;
  // Patch the deadline. Absent = unchanged; 0 = clear, which also clears
  // due_all_day and due_zone; > 0 = set (UTC unix milliseconds).
  optional int64 due_at = 5;
  // Patch the reminder. Absent = unchanged; 0 = clear (fall back to due_at).
  optional int64 remind_at = 6;
  // Mark due_at as a calendar date. Requires a deadline after this patch.
  optional bool due_all_day = 7;
  // IANA zone for an all-day deadline. Empty string clears it.
  optional string due_zone = 8;
}

message DeleteTodoRequest {
  string id = 1;
}

message DeleteTodoResponse {}
